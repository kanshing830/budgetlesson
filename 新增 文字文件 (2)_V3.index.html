<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港財政預算大考驗 | 學生版 V4</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.96);
            --red-card: #ff7675;
            --green-card: #55efc4;
            --blue-card: #74b9ff;
            --dark: #2d3436;
        }

        body {
            font-family: "Microsoft JhengHei", system-ui, sans-serif;
            background: linear-gradient(135deg, #dfe6e9 0%, #b2bec3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: var(--dark);
        }

        #game-box {
            max-width: 950px;
            width: 95%;
            background: var(--glass);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            text-align: center;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
            margin: 20px 0;
        }

        .stat-panel {
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            border: 2px solid #dfe6e9;
        }

        .value { font-size: 2.2rem; font-weight: 900; margin: 5px 0; }

        .sat-wrapper { display: flex; align-items: center; gap: 10px; position: relative; padding: 10px 0; }
        .bar-outer { 
            flex-grow: 1; height: 35px; background: #eee; border-radius: 20px; 
            overflow: hidden; border: 3px solid #333; position: relative;
        }
        #bar-inner { height: 100%; width: 50%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); background: #2ecc71; }
        .pass-line { position: absolute; left: 80%; top: 0; width: 5px; height: 100%; background: #000; z-index: 5; }
        .pass-label { position: absolute; left: 80%; top: -22px; font-size: 0.8rem; font-weight: bold; transform: translateX(-50%); }

        /* --- Refined Card Styling --- */
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 30px; 
            margin-top: 25px; 
            padding: 10px;
        }
        
        .card { 
            height: 320px; /* Taller height for card shape */
            width: 100%;
            perspective: 1000px; 
            cursor: pointer; 
        }

        .card-inner { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .card:hover .card-inner {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .card.is-flipped .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; 
            width: 100%; 
            height: 100%;
            backface-visibility: hidden; 
            border-radius: 15px;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            padding: 20px; 
            box-sizing: border-box; 
            border: 6px solid white; /* Card border effect */
            outline: 2px solid #333;
        }

        .card-front { 
            font-size: 1.5rem; 
            font-weight: bold; 
            text-align: center; 
            color: #2d3436; 
            background-size: cover;
        }

        .card-back { 
            background: #f9f9f9; 
            transform: rotateY(180deg); 
            font-weight: bold; 
            color: #636e72;
        }

        /* --- UI Components --- */
        #modal-overlay {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 30px;
            max-width: 450px; width: 90%; text-align: center; border: 6px solid var(--dark);
        }
        .btn {
            background: var(--dark); color: white; border: none; padding: 12px 40px;
            border-radius: 25px; font-size: 1.2rem; cursor: pointer; margin-top: 20px; font-weight: bold;
        }

        #end-screen {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.95); z-index: 200; color: white;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
    </style>
</head>
<body>

<div id="game-box">
    <h1 style="margin:0; font-size: 2.5rem;">👨‍💼 財政預算大考驗 </h1>
    <p style="font-size: 1.2rem; background: #333; color: #fff; display: inline-block; padding: 5px 20px; border-radius: 10px;">
        目標：10輪結束後達到 預算平衡 (≥$0) 和 80% 滿意度
    </p>
    
    <div style="margin-top:10px; font-weight: bold;">第 <span id="round-text" style="font-size: 1.5rem; color: #e67e22;">1</span> / 10 輪</div>

    <div class="dashboard">
        <div class="stat-panel">
            <div style="font-weight: bold;">💰 財政盈餘/赤字</div>
            <div id="budget-display" class="value">$0</div>
        </div>
        <div class="stat-panel">
            <div style="font-weight: bold;">😊 市民滿意度</div>
            <div class="sat-wrapper">
                <div id="emoji-face" style="font-size: 3rem;">😐</div>
                <div class="bar-outer">
                    <div class="pass-label">及格線 80%</div>
                    <div class="pass-line"></div>
                    <div id="bar-inner"></div>
                </div>
                <div id="sat-percent" style="font-weight: 900; width: 50px;">50%</div>
            </div>
        </div>
    </div>

    <div class="card-grid" id="deck"></div>
</div>

<div id="modal-overlay">
    <div class="modal-content">
        <h2 style="color: #2d3436; margin-top:0;">📋 政策影響評估</h2>
        <div id="modal-body" style="text-align: left; font-size: 1.1rem; border-top: 2px solid #eee; padding-top: 15px;"></div>
        <button class="btn" onclick="closeModal()">確認結果 (OK)</button>
    </div>
</div>

<div id="end-screen">
    <h1 id="end-title" style="font-size: 3rem;"></h1>
    <p id="end-body" style="font-size: 1.5rem;"></p>
    <button class="btn" style="background:#f1c40f; color:#000;" onclick="location.reload()">重新開始</button>
</div>

<script>
    let budget = 0;
    let satisfaction = 50;
    let round = 1;

    // Policy Data
    const policies = {
        A: [
            { t: "🚭 調升煙草稅", m: 4, h: -8, rm: "稅收穩定增加。", rh: "吸煙人士生活開支受影響。" },
            { t: "🍭 徵收糖果稅", m: 3, h: -6, rm: "政府開拓細微稅源。", rh: "飲品加價引起小部分民怨。" },
            { t: "🚗 增加車牌登記費", m: 4, h: -6, rm: "增加國庫穩定收入。", rh: "準備買車的市民感到無奈。" },
            { t: "🏥 微調急症室收費", m: 3, h: -7, rm: "稍微減輕醫療財政壓力。", rh: "基層市民看病負擔增加。" },
            { t: "💼 調高博彩稅", m: 4, h: -4, rm: "馬會及博彩稅收增加。", rh: "對一般市民影響輕微。" },
            { t: "⚡ 減少電費補貼", m: 4, h: -5, rm: "節省政府大筆支出。", rh: "市民電費負擔稍微加重。" },
            { t: "🌉 增加隧道費", m: 3, h: -7, rm: "增加運輸署預算。", rh: "物流與司機成本上升。" },
            { t: "🏖️ 復收酒店稅", m: 3, h: -6, rm: "增加旅遊相關稅收。", rh: "市民對此沒什麼感覺。" },
            { t: "⚖️ 削減部門開支", m: 4, h: -8, rm: "提升政府行政效率。", rh: "部分公共服務反應變慢。" },
            { t: "🏗️ 延遲非緊急基建", m: 2, h: -3, rm: "短期內節省大量預算。", rh: "未來便利度可能受阻。" }
        ],
        B: [
            { t: "🌳 加強公園綠化", m: -1, h: 10, rm: "購買花草及維護費。", rh: "社區環境變得更漂亮。" },
            { t: "🎨 舉辦無人機表演", m: -2, h: 9, rm: "活動策劃與電力支出。", rh: "增加節日歡樂氣氛。" },
            { t: "🚴 增設海濱單車徑", m: -1, h: 11, rm: "路面設計與工程費用。", rh: "市民有更多運動空間。" },
            { t: "📚 更新圖書館設備", m: -1, h: 5, rm: "購置自助借書機器。", rh: "借閱流程變得更快捷。" },
            { t: "🎪 推行地區周末市集", m: -1, h: 9, rm: "場地佈置與管理費。", rh: "增加市民假日消遣處。" },
            { t: "🚌 增設深夜小巴站", m: -1, h: 6, rm: "營運與配套設施開支。", rh: "夜歸市民感到更安心。" },
            { t: "🍱 免費學生午餐", m: -1, h: 8, rm: "學校膳食補貼支出。", rh: "學童營養得到保障。" },
            { t: "🩺 增加健康中心活動", m: -1, h: 11, rm: "推廣及講師聘請費。", rh: "市民健康意識提高。" },
            { t: "📱 政府辦公電子化", m: -1, h: 6, rm: "系統開發與維護費。", rh: "辦事效率顯著提升。" },
            { t: "🎭 資助社區劇團", m: -1, h: 7, rm: "劇團補貼與器材費。", rh: "提升社區文化水平。" }
        ],
        C: [
            { t: "🧧 派發小型消費券", m: -3, h: 18, rm: "一次性財政撥款。", rh: "市民能夠免費購物。" },
            { t: "🚌 交通月票補貼", m: -2, h: 15, rm: "承擔部分運輸差價。", rh: "通勤人士每月支出減少。" },
            { t: "🏥 增加醫療券金額", m: -2, h: 11, rm: "年度福利預算增加。", rh: "長者看病負擔減輕。" },
            { t: "🏫 免除學生雜費", m: -2, h: 13, rm: "教育專項經費開支。", rh: "家長壓力大大減輕。" },
            { t: "🏠 基層租金津貼", m: -3, h: 14, rm: "社會福利預算增加。", rh: "居住環境壓力得到舒緩。" },
            { t: "👶 派發育兒獎金", m: -2, h: 13, rm: "發放現金補助金。", rh: "鼓勵年輕家庭生育。" },
            { t: "🔋 代繳部分電費", m: -3, h: 17, rm: "直接能源補貼支出。", rh: "全港家庭直接獲益。" },
            { t: "💻 資助中小企", m: -2, h: 14, rm: "軟體購買補貼支出。", rh: "商業活力稍微提升。" },
            { t: "🛠️ 青年創業資助", m: -2, h: 13, rm: "青年發展專項基金。", rh: "年輕人有更多機會。" },
            { t: "🏞️ 優化海濱設施", m: -2, h: 14, rm: "休閒景觀維護開支。", rh: "好評如潮的休閒空間。" }
        ]
    };

    // Shuffling function to ensure unique order each game
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // Initialize Shuffled Decks
    let deckA = shuffle([...policies.A]);
    let deckB = shuffle([...policies.B]);
    let deckC = shuffle([...policies.C]);

    function updateUI() {
        const bVal = document.getElementById('budget-display');
        bVal.innerText = (budget >= 0 ? '$' : '-$') + Math.abs(budget);
        bVal.style.color = budget >= 0 ? '#27ae60' : '#c0392b';
        document.getElementById('sat-percent').innerText = satisfaction + '%';
        const bar = document.getElementById('bar-inner');
        bar.style.width = satisfaction + '%';
        const emoji = document.getElementById('emoji-face');
        if (satisfaction < 30) { emoji.innerText = "😭"; bar.style.background = "#e74c3c"; }
        else if (satisfaction < 70) { emoji.innerText = "😐"; bar.style.background = "#f1c40f"; }
        else if (satisfaction < 80) { emoji.innerText = "😊"; bar.style.background = "#2ecc71"; }
        else { emoji.innerText = "🤩"; bar.style.background = "#00ff88"; }
        document.getElementById('round-text').innerText = round;
    }

    function generateCards() {
        const deckContainer = document.getElementById('deck');
        deckContainer.innerHTML = '';
        
        // Take the next unique card from each pre-shuffled deck based on current round
        let roundOptions = [
            { ...deckA[round - 1], color: 'var(--red-card)' },
            { ...deckB[round - 1], color: 'var(--green-card)' },
            { ...deckC[round - 1], color: 'var(--blue-card)' }
        ];

        // Randomize the position (Red/Green/Blue not always in the same spot)
        roundOptions = shuffle(roundOptions);

        roundOptions.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front" style="background-color:${p.color}">${p.t}</div>
                    <div class="card-back">⚖️ 評估中...</div>
                </div>
            `;
            card.onclick = () => select(card, p);
            deckContainer.appendChild(card);
        });
    }

    function select(el, p) {
        if (el.classList.contains('is-flipped')) return;
        el.classList.add('is-flipped');
        
        // Disable clicking other cards once one is chosen
        const cards = document.querySelectorAll('.card');
        cards.forEach(c => c.style.pointerEvents = 'none');

        budget += p.m;
        satisfaction = Math.min(100, Math.max(0, satisfaction + p.h));

        setTimeout(() => {
            const modal = document.getElementById('modal-overlay');
            const body = document.getElementById('modal-body');
            body.innerHTML = `
                <p><strong>政策內容：</strong> ${p.t}</p>
                <p style="color:#c0392b">💰 <strong>財政影響：</strong> ${p.m >= 0 ? '+' : ''}${p.m} 元<br>🔎 ${p.rm}</p>
                <p style="color:#27ae60">😊 <strong>民心變動：</strong> ${p.h >= 0 ? '+' : ''}${p.h}%<br>❤️ ${p.rh}</p>
            `;
            modal.style.display = 'flex';
        }, 600);
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        round++;
        updateUI();
        if (round <= 10) {
            generateCards();
        } else {
            finish();
        }
    }

    function finish() {
        const screen = document.getElementById('end-screen');
        const won = budget >= 0 && satisfaction >= 80;
        screen.style.display = 'flex';
        if (won) {
            document.getElementById('end-title').innerText = "🏆 你是一個完美的財政司司長！";
            document.getElementById('end-body').innerHTML = `最終財政：$${budget}<br>最終滿意度：${satisfaction}%<br>你成功達成了雙重目標！`;
        } else {
            document.getElementById('end-title').innerText = "📉 繼續努力";
            let failReason = budget < 0 && satisfaction < 80 ? "財政赤字且滿意度不足。" : (budget < 0 ? "財政仍有赤字。" : "市民滿意度未達80%。");
            document.getElementById('end-body').innerHTML = `未能同時達成兩大目標。<br>原因：${failReason}<br>最終預算：$${budget} | 最終滿意度：${satisfaction}%`;
        }
    }

    updateUI();
    generateCards();
</script>

</body>
</html>
